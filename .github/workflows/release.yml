name: Release

# Builds the WPF app and publishes a Velopack release to GitHub Releases, producing the same
# asset set as upstream (LuaTools-win-Setup.exe, LuaTools-win-Portable.zip, LuaTools-<ver>-full.nupkg,
# releases.win.json, assets.win.json, RELEASES) so the in-app auto-updater works unchanged.
#
# Triggers:
#   * push a tag like v1.1.3
#   * run it manually (version is read from the csproj)
#   * auto-release.yml calls it after merging an upstream release. Tag and version are passed in
#     rather than resolved from the ref, because a reusable workflow starts from its own empty ref.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.3.2). Empty resolves it from the ref/csproj.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Single source of truth: the <Version> tag in the app project.
            VERSION="$(grep -oE '<Version>[^<]+' src/LuaToolsGui/LuaToolsGui.csproj | head -1 | sed 's/<Version>//')"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Framework-dependent publish (no bundled runtime), matching the ~10 MB release builds.
      # The .NET 10 Desktop Runtime is instead installed by the Velopack installer, see --framework below.
      - name: Publish
        run: >
          dotnet publish src/LuaToolsGui/LuaToolsGui.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pinned to the app's Velopack version (PackageReference Velopack 1.2.0) so pack/upload match
      # the runtime the app itself links against.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # Fetch the previous release so vpk can emit delta packages and carry the channel forward.
      # Harmless on the very first release, where there is nothing to download.
      - name: Download previous releases
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases

      # Velopack refuses to publish a version that is not strictly higher than what the channel
      # already holds, and it fails at pack time with a one-line message. Checking here names the
      # actual problem instead of leaving a bare "equal or greater" error.
      - name: Check version is not a downgrade
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL_FILE="Releases/releases.win.json"
          CURRENT="${{ steps.version.outputs.version }}"
          if [ ! -f "$CHANNEL_FILE" ]; then
            echo "No existing channel file; this is the first release. Fine."
            exit 0
          fi
          LATEST=$(grep -oE '"version":"[^"]+"' "$CHANNEL_FILE" | head -1 | cut -d'"' -f4)
          echo "Releasing $CURRENT; channel already has $LATEST"
          if [ -z "$LATEST" ]; then
            echo "Could not read the latest version; continuing."; exit 0
          fi
          HIGHER=$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)
          if [ "$HIGHER" != "$CURRENT" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "::error title=Version would go backwards::v${CURRENT} is not higher than the already published v${LATEST}. Bump <Version> in src/LuaToolsGui/LuaToolsGui.csproj (or delete that release) and run again."
            exit 1
          fi
          echo "OK: $LATEST -> $CURRENT"

      # --framework net10.0-x64-desktop: the setup installs the .NET 10 Desktop Runtime when missing.
      # --channel win keeps the asset naming identical to upstream (LuaTools-win-*).
      - name: Pack
        run: >
          vpk pack
          --packId LuaTools
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe LuaTools.exe
          --packTitle LuaTools
          --packAuthors LuaTools
          --icon src/LuaToolsGui/icon.ico
          --channel win
          --runtime win-x64
          --framework net10.0-x64-desktop
          --outputDir Releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases
          --publish
          --merge
          --releaseName "v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}

      - name: List release assets
        run: Get-ChildItem Releases | Select-Object Name, Length | Format-Table -AutoSize
