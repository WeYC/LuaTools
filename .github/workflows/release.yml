name: Release

# Builds the WPF app and publishes a Velopack release to GitHub Releases, producing the same
# asset set as upstream (LuaTools-win-Setup.exe, LuaTools-win-Portable.zip, LuaTools-<ver>-full.nupkg,
# releases.win.json, assets.win.json, RELEASES) so the in-app auto-updater works unchanged.
#
# Triggers:
#   * push a tag like v1.1.3
#   * run it manually (version is read from the csproj)
#   * auto-release.yml calls it after merging an upstream release. Tag and version are passed in
#     rather than resolved from the ref, because a reusable workflow starts from its own empty ref.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.3.2). Empty resolves it from the ref/csproj.
        required: false
        type: string
        default: ""
      ref:
        description: >
          Commit to build. Empty uses github.sha. The caller must pass the commit it wants released:
          github.sha here is the CALLER's start commit, which after a merge is not the merged tree.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      # Check out the tree that is actually being released.
      #
      # `ref` MUST come from the caller whenever it merged anything, and this is not cosmetic.
      # github.sha inside a reusable workflow is the CALLER's start commit. For upstream-sync that is
      # the sync job's commit BEFORE it merged upstream and before it bumped <Version>, so building it
      # publishes the released version number containing the PREVIOUS code. It shipped that way for
      # v1.3.3: the tag points at f856468 but the release binaries were built from its parent
      # fc4080d, silently dropping that run's "Align app version" commit. That instance was harmless
      # (the omitted change only touched the csproj <Version>, which -p:Version overrides anyway), but
      # the first merge carrying real upstream code would have published old code under a new version
      # - and clients compare version numbers only, so they would never receive the change.
      #
      # Deliberately NOT `ref: inputs.tag`: on the first release of a version that tag does not exist
      # yet. Nothing pushes it beforehand - upstream-sync only pushes main, and `vpk upload --tag`
      # below is what creates it. Checking out a nonexistent ref would fail the job outright.
      #
      # Falls back to github.sha for a tag push (GITHUB_REF is the tag, so github.sha is its commit)
      # and for a manual branch run, where that is the intent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history: vpk needs it to produce delta packages against the previous release.
          fetch-depth: 0

      # Warn when the tag doesn't describe the tree being built. The build is versioned by -p:Version
      # regardless, so this is a signal, not a gate: it fires when a tag was reused or moved, or when
      # a caller forgot to pass ref and we fell back to its (possibly pre-merge) github.sha - exactly
      # the v1.3.3 shape.
      - name: Check tag against the checked-out tree
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          WANT="${TAG#v}"
          HAVE="$(grep -oE '<Version>[^<]+' src/LuaToolsGui/LuaToolsGui.csproj | head -1 | sed 's/<Version>//')"
          echo "Tag $TAG names version $WANT; checked-out csproj declares $HAVE (building $(git rev-parse --short HEAD))"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::warning title=Tag/csproj version mismatch::Tag ${TAG} names version ${WANT}, but the checked-out tree declares ${HAVE}. Building ${WANT} from commit $(git rev-parse --short HEAD). Pass the merged commit as 'ref', or align <Version> in the tag's commit."
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Single source of truth: the <Version> tag in the app project.
            VERSION="$(grep -oE '<Version>[^<]+' src/LuaToolsGui/LuaToolsGui.csproj | head -1 | sed 's/<Version>//')"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Framework-dependent publish (no bundled runtime), matching the ~10 MB release builds.
      # The .NET 10 Desktop Runtime is instead installed by the Velopack installer, see --framework below.
      - name: Publish
        run: >
          dotnet publish src/LuaToolsGui/LuaToolsGui.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pinned to the app's Velopack version (PackageReference Velopack 1.2.0) so pack/upload match
      # the runtime the app itself links against.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # Fetch the previous release so vpk can emit delta packages and carry the channel forward.
      # Harmless on the very first release, where there is nothing to download.
      - name: Download previous releases
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases

      # Velopack refuses to publish a version that is not strictly higher than the one already in the
      # channel, and it fails at pack time with a one-line message that does not say what to change.
      #
      # Releasing the same version again is the normal case here, because the version just follows
      # upstream: re-running a release after a workflow fix must replace the previous build instead of
      # failing.
      #
      # This asks the GitHub API rather than parsing Releases/releases.win.json. That file is
      # Velopack's own serialisation (its property casing is not a public contract), and grepping it
      # silently yielded an empty version, which skipped the delete and let vpk fail later with
      # "equal or greater". The API answer is exact and is also what the upload targets.
      - name: Replace an existing release of the same version
        id: resolve_channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version }}"
          TAG="v${CURRENT}"

          # Versions of every published release in this repo, newest first (drafts excluded: they are
          # not visible to users and vpk will overwrite them anyway).
          PUBLISHED=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts \
                        --json tagName --jq '.[].tagName' | sed 's/^v//' | sort -V -r || true)

          if [ -z "$PUBLISHED" ]; then
            echo "No published releases yet; this is the first one."
            exit 0
          fi

          LATEST=$(printf '%s\n' "$PUBLISHED" | head -1)
          echo "Releasing $CURRENT; newest published release is $LATEST"

          if printf '%s\n' "$PUBLISHED" | grep -qxF "$CURRENT"; then
            echo "::notice title=Replacing v${CURRENT}::A release for v${CURRENT} already exists; deleting the release so this build replaces it."
            # Delete the RELEASE only. --cleanup-tag would also remove refs/tags/$TAG, and that tag is
            # this repo's record of the commit behind the version, which a rebuild must not discard.
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            echo "Deleted the existing release $TAG (its git tag stays)."

            # The channel files on disk still describe the release just deleted, and those files are
            # what vpk actually validates against at pack time. Drop them and refetch so packing starts
            # from the real remaining state.
            rm -rf Releases
            echo "Re-downloading the remaining releases to rebuild the channel state."
            vpk download github \
              --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" \
              --channel win \
              --outputDir Releases || echo "Nothing left to download; starting an empty channel."
            exit 0
          fi

          HIGHER=$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)
          if [ "$HIGHER" != "$CURRENT" ]; then
            echo "::error title=Version would go backwards::v${CURRENT} is lower than the already published v${LATEST}. Bump <Version> in src/LuaToolsGui/LuaToolsGui.csproj past v${LATEST} and run again."
            exit 1
          fi
          echo "OK: v${LATEST} -> v${CURRENT}"

      # --framework net10.0-x64-desktop: the setup installs the .NET 10 Desktop Runtime when missing.
      # --channel win keeps the asset naming identical to upstream (LuaTools-win-*).
      - name: Pack
        run: >
          vpk pack
          --packId LuaTools
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe LuaTools.exe
          --packTitle LuaTools
          --packAuthors LuaTools
          --icon src/LuaToolsGui/icon.ico
          --channel win
          --runtime win-x64
          --framework net10.0-x64-desktop
          --outputDir Releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases
          --publish
          --merge
          --releaseName "v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}

      - name: List release assets
        run: Get-ChildItem Releases | Select-Object Name, Length | Format-Table -AutoSize
