name: Release

# Builds the WPF app and publishes a Velopack release to GitHub Releases, producing the same
# asset set as upstream (LuaTools-win-Setup.exe, LuaTools-win-Portable.zip, LuaTools-<ver>-full.nupkg,
# releases.win.json, assets.win.json, RELEASES) so the in-app auto-updater works unchanged.
#
# Triggers:
#   * push a tag like v1.1.3
#   * run it manually (version is read from the csproj)
#   * auto-release.yml calls it after merging an upstream release. Tag and version are passed in
#     rather than resolved from the ref, because a reusable workflow starts from its own empty ref.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.3.2). Empty resolves it from the ref/csproj.
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Single source of truth: the <Version> tag in the app project.
            VERSION="$(grep -oE '<Version>[^<]+' src/LuaToolsGui/LuaToolsGui.csproj | head -1 | sed 's/<Version>//')"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Framework-dependent publish (no bundled runtime), matching the ~10 MB release builds.
      # The .NET 10 Desktop Runtime is instead installed by the Velopack installer, see --framework below.
      - name: Publish
        run: >
          dotnet publish src/LuaToolsGui/LuaToolsGui.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Pinned to the app's Velopack version (PackageReference Velopack 1.2.0) so pack/upload match
      # the runtime the app itself links against.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      # Fetch the previous release so vpk can emit delta packages and carry the channel forward.
      # Harmless on the very first release, where there is nothing to download.
      - name: Download previous releases
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases

      # Velopack refuses to publish a version that is not strictly higher than the one already in the
      # channel, and it fails at pack time with a one-line message that does not say what to change.
      #
      # Because this fork's version just follows upstream, rebuilding the SAME version is the normal
      # case (e.g. re-running a release after a workflow fix), so an identical version is not an error
      # here: the existing release is deleted and this build replaces it. A version that is actually
      # LOWER than the channel stays a hard failure — that would strand users on a newer build.
      - name: Replace an existing release of the same version
        id: resolve_channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="${{ steps.version.outputs.version }}"
          TAG="v${CURRENT}"
          CHANNEL_FILE="Releases/releases.win.json"

          if [ ! -f "$CHANNEL_FILE" ]; then
            echo "No existing channel file: nothing is published yet, proceeding."
            exit 0
          fi

          LATEST=$(grep -oE '"version":"[^"]+"' "$CHANNEL_FILE" | head -1 | cut -d'"' -f4 || true)
          if [ -z "$LATEST" ]; then
            echo "Could not read a version from the channel file; proceeding."
            exit 0
          fi
          echo "Releasing $CURRENT; channel already has $LATEST"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "::notice title=Replacing v${CURRENT}::A release for v${CURRENT} already exists; deleting it so this build replaces it."
            # Delete the GitHub release and its tag, so the upload below can recreate both cleanly.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "Deleted existing release $TAG."
            else
              echo "No GitHub release for $TAG; the channel file was stale. Continuing."
            fi

            # The downloaded channel files still describe the release we just deleted (and still
            # contain its entry), which is what vpk actually validates against at pack time. Drop
            # them and refetch, so packing starts from the real remaining state.
            rm -rf Releases
            echo "Re-downloading the remaining releases to rebuild the channel state."
            vpk download github \
              --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" \
              --channel win \
              --outputDir Releases || echo "Nothing left to download; starting an empty channel."
            exit 0
          fi

          HIGHER=$(printf '%s\n%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)
          if [ "$HIGHER" != "$CURRENT" ]; then
            echo "::error title=Version would go backwards::v${CURRENT} is lower than the already published v${LATEST}. Bump <Version> in src/LuaToolsGui/LuaToolsGui.csproj past v${LATEST} and run again."
            exit 1
          fi
          echo "OK: v${LATEST} -> v${CURRENT}"

      # --framework net10.0-x64-desktop: the setup installs the .NET 10 Desktop Runtime when missing.
      # --channel win keeps the asset naming identical to upstream (LuaTools-win-*).
      - name: Pack
        run: >
          vpk pack
          --packId LuaTools
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe LuaTools.exe
          --packTitle LuaTools
          --packAuthors LuaTools
          --icon src/LuaToolsGui/icon.ico
          --channel win
          --runtime win-x64
          --framework net10.0-x64-desktop
          --outputDir Releases

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases
          --publish
          --merge
          --releaseName "v${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}

      - name: List release assets
        run: Get-ChildItem Releases | Select-Object Name, Length | Format-Table -AutoSize
