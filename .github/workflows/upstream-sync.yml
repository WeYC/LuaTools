name: Upstream auto-release

# Watches the upstream repository for a new release. When one appears it merges upstream into this
# fork and, only if the merge is clean, calls release.yml to build and publish.
#
# Split into three stages on purpose:
#   check   - NO checkout. Three GitHub API reads. Answers "is there anything to build?" in seconds.
#   sync    - full-history checkout + merge, and ONLY when check found a merge is genuinely needed.
#   release - the reusable build/publish workflow.
#
# The split is what makes the 6-hourly schedule cheap. A scheduled tick almost always finds nothing
# to do, and the old single-job form paid for a clone of the fork's entire history (fetch-depth: 0)
# on every one of them, purely to read one <Version> line out of the csproj before concluding
# "nothing to do". Now the no-op path touches no files at all, and the expensive clone happens only
# on the rare tick that actually has upstream work to merge.
#
# Deliberately separate from release.yml: that file stays a plain "build and publish" workflow with
# no upstream logic, and this one only ever calls it after a successful merge. Nothing here pushes a
# tag, so a single sync can never build twice — release.yml creates the release and its tag itself.

on:
  schedule:
    # Every 6 hours. Upstream releases a few times a month, so this is plenty; a GitHub-scheduled run
    # can be delayed at peak times, which does not matter at this cadence. The check job is nearly
    # free, so the cadence can stay short for latency without the old per-tick clone cost.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release again even when a release for that tag already exists.
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Never let two syncs run at once: both would merge into main and push.
  group: upstream-auto-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: madoiscool/LuaTools

jobs:
  # ── Stage 1: the cheap gate ─────────────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
      mode: ${{ steps.decide.outputs.mode }}

    steps:
      # Intentionally NO actions/checkout. Everything below is a GitHub API read, so a tick with no
      # upstream release finishes without cloning anything.
      - name: Decide what to do
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          FORCE="${FORCE:-false}"

          # Is a release for this tag PUBLISHED and USABLE in our own repo?
          #
          # Two stricter conditions than "a release row exists", both load-bearing:
          #
          #  * A draft is not visible to users, so it is not published yet.
          #  * The release must carry the feed asset the Velopack client actually reads
          #    (releases.win.json, non-zero). A release that appeared before its assets finished
          #    uploading would otherwise count as "already released", and this workflow would latch
          #    onto "Nothing to do" forever - never retrying, leaving the fork permanently behind.
          #    Cheap to test here, and it is the only place that could catch that state.
          #
          # The RELEASE (not merely a tag) is the marker: tags get pushed by hand and by failed runs,
          # and this fork already carries a v1.1.3 tag whose release predates upstream.
          released() {
            local tag="$1" body
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null) || return 1
            [ "$(printf '%s' "$body" | jq -r '.draft')" = "false" ] || return 1
            [ "$(printf '%s' "$body" \
                  | jq -r '[.assets[] | select(.name == "releases.win.json" and .size > 0)] | length')" -gt 0 ]
          }

          echo "Looking up the latest release of $UPSTREAM_REPO"
          if ! REL=$(gh api "repos/$UPSTREAM_REPO/releases/latest" 2>/dev/null); then
            echo "::error::Could not read ${UPSTREAM_REPO}'s releases. Check that the repository still exists and is public."
            exit 1
          fi
          UPSTREAM_TAG=$(printf '%s' "$REL" | jq -r '.tag_name // empty')
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Upstream has no published release to track."
            exit 1
          fi
          echo "Latest upstream release: $UPSTREAM_TAG"

          # What this fork would call its own build: the same single-source-of-truth <Version> the
          # release workflow reads, fetched through the contents API and base64-decoded instead of
          # through a checkout.
          #
          # tr -d strips the newline the API's JSON escapes leave behind. Trailing whitespace makes
          # some base64 implementations (busybox, the git-bash one) emit "invalid input" and exit
          # non-zero even though they decoded the payload fine, which would fail this step spuriously.
          CSPROJ=$(gh api \
                "repos/$GITHUB_REPOSITORY/contents/src/LuaToolsGui/LuaToolsGui.csproj?ref=${GITHUB_REF_NAME:-main}" \
                --jq '.content' | tr -d ' \n\r\t' | base64 -d) || {
            echo "::error::Could not read src/LuaToolsGui/LuaToolsGui.csproj from ${GITHUB_REPOSITORY}."
            exit 1
          }
          LOCAL_VERSION=$(printf '%s' "$CSPROJ" | grep -oE '<Version>[^<]+' | head -1 | sed 's/<Version>//' || true)
          if [ -z "$LOCAL_VERSION" ]; then
            echo "::error::No <Version> element in src/LuaToolsGui/LuaToolsGui.csproj."
            exit 1
          fi
          echo "local version: $LOCAL_VERSION"

          if ! released "$UPSTREAM_TAG"; then
            # A new upstream release: merge it, then publish the merged tree under the upstream tag.
            MODE=merge
            TAG="$UPSTREAM_TAG"
          else
            # Upstream has nothing new for us. Still publish when our own version has no release yet
            # (a local change bumped <Version>), or this fork would sit on an older build than its own
            # source and users would never receive it. This needs no merge, so sync is skipped.
            MODE=local
            TAG="v$LOCAL_VERSION"
            if [ "$FORCE" != "true" ] && released "$TAG"; then
              echo "Nothing to do: $TAG is already released and upstream has nothing newer."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Plan: mode=$MODE tag=$TAG"
          {
            echo "mode=$MODE"
            echo "tag=$TAG"
            echo "should_release=true"
          } >> "$GITHUB_OUTPUT"

  # ── Stage 2: merge, only when there is something to merge ──────────────────────────────────────
  sync:
    needs: check
    # Gate the whole job, not just its steps: in `local` mode there is nothing to merge, and this is
    # the job that owns the expensive fetch-depth: 0 clone.
    if: needs.check.outputs.should_release == 'true' && needs.check.outputs.mode == 'merge'
    runs-on: ubuntu-latest

    outputs:
      # The merged + version-aligned commit that the release must build. Empty when sync is skipped
      # (local mode), which release.yml treats as "use the branch HEAD".
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the merge below needs a real merge base against upstream.
          fetch-depth: 0

      - name: Fetch upstream
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" 2>/dev/null || true
          git fetch upstream --tags --force
          echo "Fetched upstream; $(git rev-parse --short "$TAG") is the release commit."

      - name: Merge upstream
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge the release TAG, not the branch head: the tag is the exact commit upstream built and
          # published, so it cannot drift mid-run. A merge commit (never a rebase) keeps our local
          # commits intact and keeps future merges fast-forwardable. If our fork is already at or past
          # that commit this is a no-op, which is fine: the release below still runs.
          echo "Merging $TAG into the fork"
          if ! git merge --no-edit --no-squash "$TAG"; then
            git merge --abort || true
            echo "::error title=Upstream merge conflict::Merging $TAG conflicts with this fork's changes. Resolve it by hand: git fetch upstream && git merge $TAG, fix the conflicts, commit, push, then re-run this workflow."
            exit 1
          fi

      # The fork's version tracks upstream (this is a stripped-down fork, kept deliberately close), but
      # upstream does NOT keep <Version> in its csproj up to date: every tag from v1.1.3 through v1.3.2
      # still declares 1.1.3, because their release flow passes the version to vpk separately. Without
      # this step our csproj would keep saying 1.1.3 while the channel already holds 1.3.2, and
      # `vpk pack` refuses to publish a version that is not strictly higher than the existing one.
      - name: Align app version with upstream
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILE=src/LuaToolsGui/LuaToolsGui.csproj

          if grep -q '<Version>' "$FILE"; then
            # Replace only the first <Version> element, which is the assembly version in the main
            # PropertyGroup (package references also mention Version, but on other lines).
            sed -i -E "0,/<Version>[^<]*<\/Version>/s//<Version>${VERSION}<\/Version>/" "$FILE"
          else
            sed -i -E "s/(<Product>[^<]*<\/Product>)/\1\n    <Version>${VERSION}<\/Version>/" "$FILE"
          fi

          echo "Declared version is now: $(grep -oE '<Version>[^<]+' "$FILE" | head -1)"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Version already aligned; nothing to commit."
          else
            git commit -m "Align app version with upstream ${TAG}"
          fi

      - name: Push merged main
        id: push
        run: |
          set -euo pipefail
          # Only main is pushed, and only when the merge actually added commits. No tag is pushed here,
          # so nothing double-triggers: the release job below creates its own release and tag.
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git push origin HEAD:main
            echo "Pushed merged main."
          else
            echo "Already up to date; nothing to push."
          fi
          # The commit the release must build. This is the merged, version-aligned tree - the whole
          # point of this job - and it is NOT the caller's github.sha and NOT the tag (which does not
          # exist yet: vpk upload creates it in the release job). Emitting it here is what lets the
          # release check out the right tree instead of the pre-merge one.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Releasing from $(git rev-parse --short HEAD)"

  # ── Stage 3: build + publish ────────────────────────────────────────────────────────────────────
  # Separate job so the release only runs after a successful sync, and so this file never needs to
  # know how to build anything.
  release:
    needs: [check, sync]
    # sync is SKIPPED (not failed) in `local` mode, so a plain needs: dependency would skip this job
    # too. Accept skipped, reject anything that actually went wrong.
    if: >-
      !cancelled()
      && needs.check.outputs.should_release == 'true'
      && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      # In merge mode: the merged commit sync just pushed. In local mode sync was skipped, so this is
      # empty and release.yml falls back to the branch HEAD - correct there, since a local bump is
      # already on main and needs no merge.
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: write
